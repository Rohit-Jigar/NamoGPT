name: NamoGPT CD (Continuous Deployment)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy-github-pages:
    name: 🌐 Build & Deploy Web Client to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Web Dependencies
        run: npm --prefix web ci

      - name: Build Web Client for Production
        run: npm --prefix web run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-backend-free:
    name: 🚀 Trigger Free Backend Deployment (Render / Webhook)
    runs-on: ubuntu-latest
    needs: deploy-github-pages
    steps:
      - name: Trigger Free Web Service Deployment
        if: ${{ env.RENDER_DEPLOY_HOOK != '' }}
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          echo "Triggering automated free backend deployment..."
          curl -f -X POST "$RENDER_DEPLOY_HOOK"
          echo "✅ Free backend deployment hook dispatched successfully!"

