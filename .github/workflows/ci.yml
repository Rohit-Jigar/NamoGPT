name: NamoGPT CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  syntax-and-lint:
    name: 🔍 Syntax & Config Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate YAML Configuration
        run: |
          npx --yes yaml-lint config.yaml server/config.yaml

      - name: Validate JSON Files
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json'))"
          node -e "JSON.parse(require('fs').readFileSync('server/package.json'))"
          node -e "JSON.parse(require('fs').readFileSync('web/package.json'))"
          node -e "JSON.parse(require('fs').readFileSync('mobile/package.json'))"
          node -e "JSON.parse(require('fs').readFileSync('mobile/app.json'))"
          node -e "JSON.parse(require('fs').readFileSync('web/public/manifest.json'))"

      - name: Check JavaScript Syntax
        run: |
          node --check server/server.js
          node --check server/api/index.js
          node --check server/models-metadata.js
          node --check server/test_ci.js
          node --check scripts/start-all.js

  test-server:
    name: ⚡ Server & LiteLLM Proxy Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        run: npm --prefix server ci

      - name: Run Server CI Test Suite
        run: npm --prefix server test

  build-web:
    name: 💻 Web & PWA Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Web Dependencies
        run: npm --prefix web ci

      - name: Build Web Production Bundle
        run: npm --prefix web run build

      - name: Verify Build Artifacts
        run: |
          test -f web/dist/index.html || exit 1
          test -f web/dist/manifest.json || exit 1
          test -f web/dist/sw.js || exit 1
          echo "✅ Production artifacts verified successfully"

      - name: Upload Web Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  mobile-check:
    name: 📱 Mobile App (React Native Expo) Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Mobile App Entrypoint
        run: |
          node -e "require('fs').readFileSync('mobile/App.js', 'utf8')"
          echo "✅ Mobile App.js file integrity verified"

  security-audit:
    name: 🛡️ Security & Secret Leak Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for Uncommitted API Keys
        run: |
          # Ensure real API keys are not committed in code
          ! grep -r "AIzaSy" --exclude=".env.example" --exclude="*.md" . || (echo "Potential Google API key detected!" && exit 1)
          ! grep -r "gsk_" --exclude=".env.example" --exclude="*.md" . || (echo "Potential Groq API key detected!" && exit 1)
          ! grep -r "nvapi-" --exclude=".env.example" --exclude="*.md" . || (echo "Potential NVIDIA API key detected!" && exit 1)
          echo "✅ Secret leakage scan passed cleanly"
