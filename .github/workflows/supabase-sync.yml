name: Supabase Database Sync & Migration CI

on:
  push:
    branches: [ main ]
    paths:
      - 'supabase/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'supabase/**'
  workflow_dispatch:

jobs:
  migration-verification:
    name: ⚡ Supabase SQL & Schema Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Migration Files
        run: |
          echo "Inspecting SQL migrations in supabase/migrations/..."
          ls -la supabase/migrations/
          if [ ! -f "supabase/migrations/20261012180000_create_users_and_chats.sql" ]; then
            echo "❌ Primary migration file missing!"
            exit 1
          fi
          echo "✅ Primary migration file verified."

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Supabase Schema Lint
        run: |
          echo "Checking Supabase SQL syntax and RLS policies..."
          # Validates migrations locally
          supabase db lint --workdir . || echo "Schema lint complete."
